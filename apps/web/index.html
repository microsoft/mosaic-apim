<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; worker-src 'self' blob:; media-src 'self' data: blob:; manifest-src 'self'; object-src 'none'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOSAIC | AI gateway control plane</title>
    <script>
      (() => {
        // Paint the last applied theme before the app loads. The app replaces it as soon as it starts.
        const root = document.documentElement
        const preference = localStorage.getItem('mosaic-theme') || 'system'
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        root.dataset.theme = preference === 'light' || preference === 'dark' ? preference : system
        try {
          const paint = JSON.parse(localStorage.getItem('mosaic-theme-paint') || 'null')
          if (!paint || (paint.theme !== 'light' && paint.theme !== 'dark')) return
          if (preference !== 'custom' && paint.theme !== root.dataset.theme) return
          root.dataset.theme = paint.theme
          for (const name of Object.keys(paint.tokens || {})) {
            if (name.startsWith('--mosaic-')) root.style.setProperty(name, String(paint.tokens[name]))
          }
        } catch {
          // A damaged cache only costs the first frame; the built-in palette shows instead.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
