# Cache-Control for each response, chosen by the file served. nginx reads $uri after try_files and
# the index redirect, so / and every SPA route map as /index.html. Only Vite's content-hashed files
# under /assets/ may be cached; everything else is revalidated, and config.js, which the container
# writes at start-up, is never stored.
map $uri $mosaic_cache_control {
  default "no-cache";
  /config.js "no-store";
  ~^/assets/ "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep every add_header at this level. An add_header inside a location stops all of these from
  # applying to that location. Cache-Control is not "always", so error responses carry none.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cache-Control $mosaic_cache_control;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # A missing hashed file is a plain-text 404, never index.html under a script or stylesheet URL.
  location ^~ /assets/ {
    try_files $uri @missing_asset;
  }

  location @missing_asset {
    types { }
    default_type text/plain;
    return 404 "Not found\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
