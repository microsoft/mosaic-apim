[project]
name = "mosaic-api"
version = "0.1.0"
description = "MOSAIC control-plane API"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12,<4",
  "azure-cosmos>=4.9,<5",
  "azure-identity>=1.24,<2",
  "azure-monitor-opentelemetry>=1.8,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
mosaic-api = "mosaic_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic_api"]
