<text x="590" y="402.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000000">Microsoft.Web/serverFarms</text>
<text x="590" y="419.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000000">API + console + portal</text>
<text x="590" y="437.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000000">Outbound, not Private Link</text>
