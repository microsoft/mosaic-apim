<text x="1175" y="296.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">Entra ID, Microsoft Graph, Azure ARM</text>
<text x="1175" y="316.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">Existing APIMs can remain in their own networks</text>
<text x="1175" y="336.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">Build/package sources and optional integrations</text>
<text x="1175" y="356.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">Not an air-gapped architecture</text>
