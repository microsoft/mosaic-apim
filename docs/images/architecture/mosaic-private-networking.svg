<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1594" viewBox="0 0 1720 1594" role="img" aria-labelledby="title description">
<title id="title">MOSAIC administrator-managed private networking reference</title>
<desc id="description">Illustrative /24 VNet, 2 CIDR-labeled subnets, 8 service private endpoints and their DNS zones. No co-located APIM or APIM subnet. Public Bicep and Terraform do not deploy this topology.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker></defs>
<rect width="1720" height="1594" fill="#ffffff"/>
<text x="35" y="47.0" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#000000">MOSAIC | Private hosting (no co-located APIM)</text>
<text x="35" y="80.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">ADMINISTRATOR-OWNED DESIGN. Supported azd/Bicep and Terraform deployments remain PUBLIC ONLY.</text>
<rect x="20" y="110" width="1680" height="1364" rx="8" stroke="#0078D4" stroke-width="1.5" fill="none"/>
<text x="40" y="142.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">Azure Commercial reference context</text>
<rect x="40" y="160" width="1640" height="1294" rx="8" stroke="#0078D4" stroke-width="1.5" fill="none"/>
<text x="60" y="188.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">MOSAIC deployment and external dependencies (logical grouping)</text>
<rect x="65" y="225" width="440" height="170" rx="8" stroke="#0078D4" stroke-width="1.5" fill="#CFE4FA"/>
<text x="85" y="261.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000">Administrators, portal users,</text>
<text x="85" y="284.75" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000">runtime clients and deployment runners</text>
<text x="85" y="318.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">Private reachability + DNS required</text>
<text x="85" y="338.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">VPN / ExpressRoute / peered connectivity</text>
<text x="85" y="358.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">provided and operated by administrators</text>
<polyline points="505,310 555,310" fill="none" stroke="#0078D4" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="75" y="434.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">Private DNS zones / records</text>
<text x="75" y="462.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">VNet links; corporate DNS needs forwarding.</text>
<text x="75" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">DNS zones are not placed inside a subnet.</text>
<rect x="555" y="225" width="540" height="1164" rx="8" stroke="#0078D4" stroke-width="1.5" fill="none"/>
<text x="575" y="263.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#000000">MOSAIC VNet | 10.42.0.0/24</text>
<text x="575" y="294.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">Illustrative ranges; size for your scale and region.</text>
