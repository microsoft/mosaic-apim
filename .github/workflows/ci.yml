name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python (API and scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-packages --group dev --locked
      - name: Lint
        run: uv run --no-sync ruff check apps/api e2e/mcp-servers
      - name: Type-check
        run: uv run --no-sync mypy apps/api/src
      - name: Test the API
        run: uv run --no-sync pytest apps/api/tests
      - name: Test the scripts
        run: uv run --no-sync python -m unittest discover -s scripts/tests -t .

  frontend:
    name: Frontend (apps/${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [web, portal]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run lint

  # The Phase 11 MCP test servers and their deployment kit sit outside the uv workspace. Each
  # installs its own pinned, hashed requirements into its own environment.
  mcp-servers:
    name: MCP test servers (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [m-tools, m-agent, deploy]
    defaults:
      run:
        working-directory: e2e/mcp-servers/${{ matrix.server }}
    env:
      # The deployment kit's tests compile its Bicep. Here they must run, not skip.
      MCP_SERVERS_REQUIRE_BICEP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
      - name: Install the pinned requirements
        # --no-config keeps the workspace's settings, such as its exclude-newer cutoff, out.
        run: |
          uv venv --no-config --python 3.13 .venv
          uv pip install --no-config --python .venv --require-hashes -r requirements-dev.txt
      - name: Test
        run: .venv/bin/python -m pytest

  # M-protected runs M-tools' image under its own name, behind Container Apps' built-in
  # authentication, which the deploy job's Bicep tests pin. This builds that image as the kit's
  # az acr build does, runs it as M-protected, and checks it with the kit's smoke checks.
  mcp-protected:
    name: MCP test servers (m-protected)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e/mcp-servers/deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build M-tools' image
        run: docker build --tag mcp-m-tools:ci ../m-tools
      - name: Run it as M-protected
        run: >-
          docker run --detach --name m-protected --publish 127.0.0.1:8000:8000
          --env MCP_SERVER_NAME=M-protected mcp-m-tools:ci
      - name: Check its tools and name, as MOSAIC's client would
        # Without the platform's authentication in front, it answers like M-tools.
        run: |
          for attempt in $(seq 1 30); do
            curl --silent --output /dev/null http://127.0.0.1:8000/mcp && break
            sleep 1
          done
          python3 smoke.py tools http://127.0.0.1:8000/mcp
          python3 - <<'PY'
          import smoke

          session = smoke.Session("http://127.0.0.1:8000/mcp")
          result = session.request(
              "initialize",
              {
                  "protocolVersion": smoke.OFFERED_PROTOCOL_VERSION,
                  "capabilities": {},
                  "clientInfo": {"name": "ci", "version": "1.0.0"},
              },
          )
          session.close()
          name = (result.get("serverInfo") or {}).get("name")
          if name != "M-protected":
              raise SystemExit(f"The image named itself {name!r}, not M-protected.")
          print("The image serves M-protected's tools as M-protected.")
          PY
      - name: Show the server's log
        if: always()
        run: docker logs m-protected

  infra:
    name: Infrastructure (Bicep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Bicep templates
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file e2e/mcp-servers/deploy/main.bicep --stdout > /dev/null

  # The main branch ruleset requires only this check, so jobs can be added or renamed without
  # changing the ruleset. It runs even when a job fails or is cancelled, and fails unless every job
  # succeeded, because a required check that is skipped counts as passing.
  result:
    name: CI result
    if: always()
    needs: [python, frontend, e2e, mcp-servers, mcp-protected, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
