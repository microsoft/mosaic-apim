[project]
name = "mosaic-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv]
exclude-newer = "2026-08-01T00:00:00Z"
constraint-dependencies = [
  "certifi>=2026.10.19",
  "multidict>=6.9.1",
  "opentelemetry-api>=1.45.1",
]

# These security releases are newer than the cutoff above, so each of these packages alone gets a
# cutoff of the day after its release. Every other package keeps the global cutoff.
[tool.uv.exclude-newer-package]
# oauthlib 4.0.0 (published 2026-09-28) fixes GHSA-hj66-6f7g-4r5v and GHSA-xpv3-w29h-x7cv.
oauthlib = "2026-09-29T00:00:00Z"
# PyJWT 2.15.0 (published 2026-09-23) fixes GHSA-42vr-xj54-vc7v. 2.14.0 fixed eight earlier
# advisories, including GHSA-ffc3-869f-jxw9.
pyjwt = "2026-09-24T00:00:00Z"
# urllib3 2.8.0 (published 2026-09-15) fixes GHSA-8988-9cw3-xx77, GHSA-vxq7-64xx-v4gw and
# GHSA-gh4c-6fx4-qh6g.
urllib3 = "2026-09-16T00:00:00Z"
# Security releases and their required transport/image dependencies.
aiohttp = "2026-10-06T00:00:00Z"
certifi = "2026-10-21T00:00:00Z"
multidict = "2026-09-22T00:00:00Z"
pillow = "2026-10-17T00:00:00Z"
yarl = "2026-09-16T00:00:00Z"
# The patched OpenTelemetry API requires a matching SDK/instrumentation family and Azure distro.
azure-monitor-opentelemetry = "2026-10-08T00:00:00Z"
azure-monitor-opentelemetry-exporter = "2026-10-08T00:00:00Z"
opentelemetry-resource-detector-azure = "2026-09-30T00:00:00Z"
opentelemetry-api = "2026-10-07T00:00:00Z"
opentelemetry-sdk = "2026-10-07T00:00:00Z"
opentelemetry-semantic-conventions = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation-asgi = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation-dbapi = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation-django = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation-fastapi = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation-flask = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation-httpx = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation-logging = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation-psycopg2 = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation-requests = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation-urllib = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation-urllib3 = "2026-10-07T00:00:00Z"
opentelemetry-instrumentation-wsgi = "2026-10-07T00:00:00Z"
opentelemetry-util-http = "2026-10-07T00:00:00Z"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
